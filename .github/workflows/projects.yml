name: Generate Projects Panel

on:
  push:
    branches:
      - main

    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_data.py"
      - ".github/workflows/projects.yml"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live GitHub repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_data.py

      - name: Generate projects SVG
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      - name: Publish projects SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
