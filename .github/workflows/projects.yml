name: Generate Projects Panel

on:
  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_data.py"
      - ".github/workflows/projects.yml"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Fetch GitHub repository data
      # ==========================================
      - name: Fetch live repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_data.py

      # ==========================================
      # 3. Generate project SVG
      # ==========================================
      - name: Generate projects SVG
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      # ==========================================
      # 4. Push generated SVG to projects branch
      # ==========================================
      - name: Push to projects branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
