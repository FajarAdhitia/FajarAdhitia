<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Fajar Adhitia — elegant profile">

  <defs>
    <!-- gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFD0B8"/>
      <stop offset="0.5" stop-color="#948979"/>
      <stop offset="1" stop-color="#DFD0B8"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFD0B8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DFD0B8" stop-opacity="1"/>
      <stop offset="1" stop-color="#DFD0B8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="18%" cy="50%" r="60%">
      <stop offset="0" stop-color="#393E46"/>
      <stop offset="1" stop-color="#181C22"/>
    </radialGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#DFD0B8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#948979" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#948979" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowBlurSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="photoClip"><circle cx="160" cy="150" r="88"/></clipPath>
    <clipPath id="cardClip"><rect x="2" y="2" width="896" height="296" rx="18"/></clipPath>
  </defs>

  <!-- base card -->
  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#bgGlow)"/>

  <g clip-path="url(#cardClip)">
    <!-- faint texture lines -->
    <g stroke="#DFD0B8" stroke-opacity="0.05">
      <line x1="0" y1="60" x2="900" y2="60"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
    </g>

    <!-- corner flourishes -->
    <g stroke="url(#gold)" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M24 24 h34 M24 24 v34"/>
      <path d="M876 24 h-34 M876 24 v34"/>
      <path d="M24 276 h34 M24 276 v-34"/>
      <path d="M876 276 h-34 M876 276 v-34"/>
    </g>
    <circle cx="24" cy="24" r="2.4" fill="#DFD0B8"/>
    <circle cx="876" cy="24" r="2.4" fill="#DFD0B8"/>
    <circle cx="24" cy="276" r="2.4" fill="#DFD0B8"/>
    <circle cx="876" cy="276" r="2.4" fill="#DFD0B8"/>

    <!-- ===== photo halo + rings ===== -->
    <circle cx="160" cy="150" r="118" fill="url(#haloGlow)">
      <animate attributeName="r" values="112;122;112" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- rotating dashed ring 1 -->
    <g transform="translate(160,150)">
      <circle r="104" fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-dasharray="4 10" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- rotating dashed ring 2, opposite direction -->
    <g transform="translate(160,150)">
      <circle r="112" fill="none" stroke="#948979" stroke-width="1" stroke-dasharray="1 14" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- fine solid ring -->
    <circle cx="160" cy="150" r="96" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.9" filter="url(#glowBlur)"/>
    <circle cx="160" cy="150" r="96" fill="none" stroke="#DFD0B8" stroke-width="1.2"/>

    <!-- orbiting sparkles -->
    <g fill="#DFD0B8">
      <circle r="2.6">
        <animateMotion dur="9s" repeatCount="indefinite" path="M160,150 m-104,0 a104,104 0 1,1 208,0 a104,104 0 1,1 -208,0"/>
        <animate attributeName="opacity" values="0;1;0.3;1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" opacity="0.8">
        <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M160,150 m-104,0 a104,104 0 1,1 208,0 a104,104 0 1,1 -208,0"/>
        <animate attributeName="opacity" values="0;0.9;0.2;0.9;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.6" opacity="0.7">
        <animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M160,150 m-104,0 a104,104 0 1,1 208,0 a104,104 0 1,1 -208,0"/>
        <animate attributeName="opacity" values="0;0.8;0.1;0.8;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- twinkling diamonds scattered -->
    <g fill="#DFD0B8">
      <path d="M270 60 l4 4 -4 4 -4 -4 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.2s" repeatCount="indefinite"/>
      </path>
      <path d="M300 220 l3.5 3.5 -3.5 3.5 -3.5 -3.5 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M60 200 l3 3 -3 3 -3 -3 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M55 90 l3 3 -3 3 -3 -3 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- profile photo -->
    <circle cx="160" cy="150" r="90" fill="#393E46"/>
    <image href="https://avatars.githubusercontent.com/u/98729482?v=4" x="70" y="60" width="180" height="180" clip-path="url(#photoClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- shimmer sweep over photo -->
    <g clip-path="url(#photoClip)">
      <rect x="0" y="60" width="60" height="180" fill="url(#goldSoft)" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,0; 340,0; 0,0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ===== text block ===== -->
    <g>
      <text x="320" y="112" font-size="30" letter-spacing="2" fill="#DFD0B8" font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
        Fajar Adhitia Suwandhi
      </text>

      <!-- animated underline draw -->
      <line x1="322" y1="126" x2="322" y2="126" stroke="url(#gold)" stroke-width="1.4">
        <animate attributeName="x2" values="322;620" dur="1.2s" begin="1.1s" fill="freeze"/>
      </line>

      <text x="320" y="156" font-size="14" letter-spacing="3" fill="#948979" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
        FRONTEND SOFTWARE ENGINEER
      </text>

      <text x="320" y="180" font-size="13" letter-spacing="1.4" fill="#948979" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.0s" fill="freeze"/>
        Informatics Student · Universitas Bengkulu
      </text>

      <text x="320" y="212" font-size="12.5" fill="#DFD0B8" opacity="0" font-style="italic">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.5s" fill="freeze"/>
        "Crafting motion-rich, elegant web experiences —
      </text>
      <text x="320" y="230" font-size="12.5" fill="#DFD0B8" opacity="0" font-style="italic">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.8s" fill="freeze"/>
        with GSAP, Three.js &amp; React."
      </text>

      <text x="320" y="266" font-size="12" letter-spacing="0.6" fill="#948979" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="3.3s" fill="freeze"/>
        <tspan fill="#DFD0B8">github.com/FajarAdhitia</tspan>
      </text>
    </g>
  </g>

  <!-- outer elegant border -->
  <rect x="2" y="2" width="896" height="296" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5" filter="url(#glowBlurSoft)"/>
  <rect x="2" y="2" width="896" height="296" rx="18" fill="none" stroke="url(#gold)" stroke-width="1.3"/>
</svg>
