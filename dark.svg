<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- ================================================= -->
<!-- BACKGROUND GRADIENT                                -->
<!-- ================================================= -->

<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
  <stop stop-color="#222831"/>
  <stop offset="0.5" stop-color="#393E46"/>
  <stop offset="1" stop-color="#222831"/>
</linearGradient>

<radialGradient id="glowCenter">
  <stop offset="0" stop-color="#DFD0B8" stop-opacity="0.16"/>
  <stop offset="0.45" stop-color="#948979" stop-opacity="0.07"/>
  <stop offset="1" stop-color="#222831" stop-opacity="0"/>
</radialGradient>

<linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#DFD0B8"/>
  <stop offset="0.5" stop-color="#948979"/>
  <stop offset="1" stop-color="#DFD0B8"/>
</linearGradient>

<linearGradient id="textGradient" x1="350" y1="150" x2="760" y2="250">
  <stop stop-color="#DFD0B8"/>
  <stop offset="1" stop-color="#948979"/>
</linearGradient>

<!-- ================================================= -->
<!-- PROFILE IMAGE                                      -->
<!-- ================================================= -->

<clipPath id="avatarClip">
  <circle cx="600" cy="205" r="73"/>
</clipPath>

<!-- ================================================= -->
<!-- GLOW FILTERS                                       -->
<!-- ================================================= -->

<filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="7"/>
</filter>

<filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>

<!-- ================================================= -->
<!-- GRID PATTERN                                       -->
<!-- ================================================= -->

<pattern
  id="grid"
  width="40"
  height="40"
  patternUnits="userSpaceOnUse"
>
  <path
    d="M40 0H0V40"
    stroke="#DFD0B8"
    stroke-opacity="0.035"
    stroke-width="1"
  />
</pattern>
```

